name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - list repo contents
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== Searching for settings.gradle* ==="
          find . -maxdepth 4 -name "settings.gradle*" -not -path "*/.git/*" || true
          echo "=== Searching for build.gradle* ==="
          find . -maxdepth 4 -name "build.gradle*" -not -path "*/.git/*" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Gradle project root
        id: locate
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "✅ Gradle project found at repo root"
          else
            FOUND=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "*/.git/*" | head -n1)
            if [ -z "$FOUND" ]; then
              echo "❌ No Gradle project found anywhere in the repo."
              echo "Make sure settings.gradle.kts, build.gradle.kts and the app/ folder are committed."
              exit 1
            fi
            DIR=$(dirname "$FOUND" | sed 's|^\./||')
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "✅ Gradle project found at: $DIR"
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuneMate-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
